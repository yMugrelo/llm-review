[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pt-review-lora"
version = "0.1.0"
description = "Classificação de sentimento em avaliações PT-BR: TF-IDF, BERTimbau, LLM via prompt e LLM+QLoRA."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Dados, baseline clássico, tracking e gráficos. Instalado no CI.
base = [
    "pandas>=2.2",
    "datasets>=3.0",
    "scikit-learn>=1.5",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "mlflow>=2.16",
    "matplotlib>=3.9",
]
# Deep learning / QLoRA. Pesado: NUNCA instalado no CI.
dl = [
    "torch>=2.4",
    "transformers>=4.45",
    "accelerate>=1.0",
    "peft>=0.13",
    "bitsandbytes>=0.44",
    "trl>=0.11",
]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]
app = [
    "gradio>=5.0",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.17",
    "pre-commit>=4.0",
    "httpx>=0.27",      # TestClient do FastAPI (Fase 7)
    "uv>=0.5",          # gera o requirements.txt universal (make lock)
]

[tool.setuptools]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"
markers = [
    "slow: precisa de GPU, modelo ou dataset real (fora do CI)",
]
